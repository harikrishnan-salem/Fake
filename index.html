<!DOCTYPE html>
<html>
<head>
<title>Screen Share Test</title>
</head>
<body>

<button id="btn">Share Screen</button>
<video id="video" autoplay playsinline controls style="width:100%;"></video>

<script>
document.getElementById("btn").onclick = async () => {

  if (!window.isSecureContext) {
    alert("HTTPS required");
    return;
  }

  if (!navigator.mediaDevices) {
    alert("mediaDevices not supported");
    return;
  }

  if (!navigator.mediaDevices.getDisplayMedia) {
    alert("getDisplayMedia not supported");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true
    });

    document.getElementById("video").srcObject = stream;

  } catch (err) {
    alert(err.name + "\n" + err.message);
  }
};
</script>

</body>
</html>

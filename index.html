<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Location Permission</title>

    <!-- WhatsApp / Facebook Link Preview -->
    <meta property="og:title"
          content="Location Permission">

    <meta property="og:description"
          content="Location permission is required to continue.">

    <meta property="og:image"
          content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/thumbnail.jpg">

    <meta property="og:url"
          content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/">

    <meta property="og:type"
          content="website">

    <!-- Other social-media preview -->
    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Location Permission">

    <meta name="twitter:description"
          content="Location permission is required to continue.">

    <meta name="twitter:image"
          content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/thumbnail.jpg">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>📍 Location Permission</h1>

    <p id="status">
        Requesting location permission...
    </p>

    <script>

        // Read URL parameters
        const params = new URLSearchParams(
            window.location.search
        );

        const redirectURL = params.get("redirect");


        // Check browser support
        if (!navigator.geolocation) {

            document.getElementById("status").textContent =
                "Geolocation is not supported by this browser.";

        } else {

            // Request location permission
            navigator.geolocation.getCurrentPosition(

                function (position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;

                    const accuracy =
                        position.coords.accuracy;


                    console.log("Latitude:", latitude);
                    console.log("Longitude:", longitude);
                    console.log("Accuracy:", accuracy + " metres");


                    document.getElementById("status").textContent =
                        "Location permission granted ✅";


                    // Redirect after location is received
                    if (redirectURL) {

                        setTimeout(function () {

                            window.location.href =
                                redirectURL;

                        }, 1000);

                    }

                },


                function (error) {

                    document.getElementById("status").textContent =
                        "Location permission denied or unavailable ❌";

                    console.log(
                        "Location error:",
                        error.message
                    );

                }

            );

        }

    </script>

</body>

</html>
